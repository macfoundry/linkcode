name: MacFoundry macOS smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macfoundry-linkcode-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on:
      group: MacFoundry CI
      labels: [self-hosted, macOS, ARM64, macfoundry-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate macOS toolchain and compile Swift
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          printf 'print("MacFoundry Swift build OK")\n' > "$RUNNER_TEMP/smoke.swift"
          swiftc "$RUNNER_TEMP/smoke.swift" -o "$RUNNER_TEMP/macfoundry-smoke"
          "$RUNNER_TEMP/macfoundry-smoke" | tee "$RUNNER_TEMP/macfoundry-result.txt"
      - name: Upload build result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macfoundry-linkcode-smoke
          path: ${{ runner.temp }}/macfoundry-result.txt
          if-no-files-found: error
          retention-days: 3
